server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The /view page is meant to be embedded (OBS, other browsers, iframes).
    # Do NOT set X-Frame-Options: DENY here.

    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "autoplay=*, clipboard-write=*, clipboard-read=*" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    # Hashed assets — long cache
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    # Static files (favicon, fonts, etc.) — short cache
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff2?|ttf)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # SPA fallback — every other route loads index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
