<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light">
    <title>Test: transparent body</title>
    <style>
      /* No background declared. With color-scheme: light on the parent iframe,
         this should render transparent (the iframe's canvas defaults to the
         "no painted background" state, not white). */
      body { margin: 0; font-family: system-ui; color: #fff; padding: 1rem; }
      .badge {
        display: inline-block;
        background: rgba(255, 107, 107, 0.9);
        padding: 4px 10px;
        border-radius: 6px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <span class="badge">transparent body</span>
  </body>
</html>
